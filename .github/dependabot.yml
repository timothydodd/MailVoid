version: 2
updates:
  - package-ecosystem: npm
    directory: /src/MailVoidWeb
    schedule:
      interval: weekly
    groups:
      # Angular packages must move together; single-package bumps break peer deps.
      angular:
        patterns:
          - "@angular/*"
          - "ng-packagr"
      npm-dev:
        dependency-type: development
        exclude-patterns:
          - "@angular/*"
          - "ng-packagr"
          - "typescript"
      npm-prod:
        dependency-type: production
        exclude-patterns:
          - "@angular/*"
    ignore:
      # TypeScript majors are pinned by Angular's supported range.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gomod
    directory: /src/go
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/go
    schedule:
      interval: weekly
