name: Build and Deploy SMTP Server

# Legacy .NET SMTP server. Main now builds the Go images (go.yml); this workflow only
# runs on demand, e.g. to publish a rollback image.
on:
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  # PR validation only — on main pushes the Docker build compiles the
  # project itself, so a separate native build would be redundant.
  build:
    name: Build SMTP Server
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore src/legacy/MailVoidSmtpServer/MailVoidSmtpServer.csproj

    - name: Build
      run: dotnet build src/legacy/MailVoidSmtpServer/MailVoidSmtpServer.csproj --configuration Release --no-restore

    - name: Publish
      run: dotnet publish src/legacy/MailVoidSmtpServer/MailVoidSmtpServer.csproj --configuration Release --no-build --output ./publish

  docker-build:
    name: Build and Push SMTP Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ secrets.DOCKERHUB_USERNAME }}/mailvoid-smtp
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: ./src/legacy/MailVoidSmtpServer
        file: ./src/legacy/MailVoidSmtpServer/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=smtp
        cache-to: type=gha,mode=max,scope=smtp
        platforms: linux/amd64,linux/arm64
