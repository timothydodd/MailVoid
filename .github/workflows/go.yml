name: Build and Deploy Go Services

# Builds the MailVoid API and SMTP server images. Every push to main publishes both
# images tagged with the short commit hash (e.g. mailvoid:0baca8c), so deployments pin
# an exact commit.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/go/**'
      - 'src/MailVoidWeb/**'
      - '.github/workflows/go.yml'
  workflow_dispatch:

jobs:
  test:
    name: Vet and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: src/go/go.mod
        cache-dependency-path: src/go/go.sum

    - name: Vet
      working-directory: src/go
      run: go vet ./...

    - name: Test
      working-directory: src/go
      run: go test ./...

  docker-build:
    name: Build and Push ${{ matrix.name }} Image
    runs-on: ubuntu-latest
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - name: API
            image: mailvoid
            context: ./src
            file: ./src/go/Dockerfile.api
          - name: SMTP
            image: mailvoid-smtp
            context: ./src/go
            file: ./src/go/Dockerfile.smtp

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
        tags: |
          type=sha,prefix=,format=short

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ${{ matrix.context }}
        file: ${{ matrix.file }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=go-${{ matrix.image }}
        cache-to: type=gha,mode=max,scope=go-${{ matrix.image }}
        platforms: linux/amd64,linux/arm64
